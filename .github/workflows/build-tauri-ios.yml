name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/apple/**'
      - 'src/**'
      - 'public/**'
      - 'contributors/**'
      - 'runtime-demo/**'
      - 'index.html'
      - 'info.json'
      - 'vite.config.mts'
      - 'tsconfig*.json'
      - 'postcss.config.cjs'
      - '.github/workflows/build-tauri-ios.yml'
  push:
    branches: ['main', 'codex/**']
    paths:
      - 'tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/apple/**'
      - 'src/**'
      - 'public/**'
      - 'contributors/**'
      - 'runtime-demo/**'
      - 'index.html'
      - 'info.json'
      - 'vite.config.mts'
      - 'tsconfig*.json'
      - 'postcss.config.cjs'
      - '.github/workflows/build-tauri-ios.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '3'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_TERM_COLOR: never
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    defaults:
      run:
        shell: bash
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.93.1'
          targets: aarch64-apple-ios
      - name: Install native build tools
        run: |
          mkdir -p .build/logs .build/artifacts
          {
            sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
            xcodebuild -version
            brew install xcodegen
            rustc --version
          } 2>&1 | tee .build/logs/tools.log
          # Keep runner paths out of Rust binaries built by the standalone Xcode phase.
          printf 'CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS=--remap-path-prefix=%s=/toolchain --remap-path-prefix=%s=/src\n' \
            "$HOME" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Test bundle resource loading
        run: |
          rustc --edition 2021 --test src/ios_asset_files.rs -o .build/ios-asset-tests
          .build/ios-asset-tests
          rustc --edition 2021 --test src/apple_export_files.rs -o .build/export-file-tests
          .build/export-file-tests
      - name: Install locked frontend and Tauri CLI dependencies
        working-directory: .
        run: |
          npm ci
          node node_modules/@tauri-apps/cli/tauri.js --version | tee -a tauri/.build/logs/tools.log
      - name: Test Apple build helpers and frontend
        working-directory: .
        run: |
          npm run apple:test
          npm run lint
          npm run test
      - name: Test native image text rendering without host system fonts
        run: |
          TAURI_CONFIG='{"build":{"frontendDist":[]},"bundle":{"resources":[]}}' \
            cargo test --locked --lib resvg::tests
      - name: Generate standalone iOS project and offline resources
        working-directory: .
        run: |
          set -o pipefail
          npm run apple:generate -- --ios-only --ci 2>&1 | tee tauri/.build/logs/init.log
      - name: Build release archive without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project gen/apple/railmapgen.xcodeproj \
            -scheme railmapgen_iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/gen/apple/build/railmapgen.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee .build/logs/build.log
          git diff --exit-code -- Cargo.lock
      - name: Assemble unsigned IPA
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import shutil
          import stat
          import zipfile

          build = pathlib.Path('gen/apple/build')
          apps = list(build.glob('*.xcarchive/Products/Applications/*.app'))
          assert len(apps) == 1, 'Expected one archived application'
          app = apps[0]
          # Retain the archive as the source of truth; do not re-sign its payload.
          staging = pathlib.Path('.build/ipa')
          shutil.rmtree(staging, ignore_errors=True)
          payload = staging / 'Payload' / app.name
          shutil.copytree(app, payload, symlinks=True)
          output = build / 'Rail-Map-Toolkit-ios-unsigned.ipa'
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(staging.rglob('*')):
                  name = path.relative_to(staging).as_posix()
                  if path.is_symlink():
                      entry = zipfile.ZipInfo(name)
                      entry.create_system = 3
                      entry.external_attr = (stat.S_IFLNK | 0o777) << 16
                      archive.writestr(entry, os.readlink(path))
                  elif path.is_file():
                      archive.write(path, name)
          PY
      - name: Verify device payload and privacy
        run: |
          python3 - <<'PY' 2>&1 | tee .build/logs/verify.log
          import json
          import os
          import pathlib
          import plistlib
          import re
          import shutil
          import subprocess
          import zipfile

          build = pathlib.Path('gen/apple/build')
          apps = list(build.glob('*.xcarchive/Products/Applications/*.app'))
          ipas = list(build.rglob('*.ipa'))
          assert len(apps) == len(ipas) == 1, 'Expected one device archive and one IPA'
          app = apps[0]
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          executable = app / info['CFBundleExecutable']
          assert sorted(info['UIDeviceFamily']) == [1, 2], 'Missing iPhone or iPad support'
          assert info.get('NSPhotoLibraryAddUsageDescription'), 'Missing export photo-library purpose'
          scene = info['UIApplicationSceneManifest']
          assert scene['UIApplicationSupportsMultipleScenes'] is False, 'Expected the single-scene host'
          assert scene['UISceneConfigurations']['UIWindowSceneSessionRoleApplication'][0]['UISceneDelegateClassName'] == 'RMTSceneDelegate', 'Missing native scene lifecycle'
          assert subprocess.check_output(['xcrun', 'lipo', '-archs', str(executable)], text=True).strip() == 'arm64'
          platform = subprocess.check_output(['xcrun', 'vtool', '-show-build', str(executable)], text=True)
          assert re.search(r'^\s*platform IOS\s*$', platform, re.M), 'Not an iPhone device binary'
          required = ['index.html'] + [f'{name}/index.html' for name in
                      ['rmg', 'rmg-palette', 'rmg-templates', 'rmp', 'rmp-gallery', 'rmp-designer', 'rma', 'rsg']]
          assert all((app / 'assets/ui' / path).is_file() for path in required), 'Missing bundled application'
          assert not list((app / 'assets/ui').rglob('.git')), 'Unexpected bundled Git metadata'
          assert all('rmt-native-edge-to-edge' in (app / 'assets/ui' / path).read_text()
                     for path in required), 'Missing edge-to-edge application adapter'
          for path in required:
              runtime_info = app / 'assets/ui' / pathlib.Path(path).with_name('info.json')
              assert json.loads(runtime_info.read_text())['instance'] == 'AppStore', f'Unexpected application instance: {path}'
          private_suffixes = {'.p12', '.pfx', '.p8', '.pem', '.key', '.mobileprovision', '.provisionprofile'}
          macho = {bytes.fromhex(value) for value in
                   ['feedface', 'cefaedfe', 'feedfacf', 'cffaedfe', 'cafebabe', 'bebafeca', 'cafebabf', 'bfbafeca']}
          for path in app.rglob('*'):
              assert path.suffix.lower() not in private_suffixes, f'Private signing material: {path.name}'
              assert not path.name.endswith(('.dSYM', '.bcsymbolmap')), 'Unexpected debug symbols in app'
              if not path.is_file():
                  continue
              with path.open('rb') as stream:
                  is_binary = stream.read(4) in macho
              if is_binary:
                  data = path.read_bytes()
                  assert all(os.environ[key].encode() not in data for key in ['HOME', 'GITHUB_WORKSPACE']), 'Runner path leaked into binary'
                  signature = subprocess.run(['codesign', '-dv', '--verbose=4', str(path)],
                                             text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  assert not re.search(r'^Authority=', signature.stdout, re.M), 'Certificate authority in unsigned payload'
                  assert not re.search(r'^TeamIdentifier=(?!not set\s*$).+', signature.stdout, re.M), 'Signing team in unsigned payload'
                  assert signature.returncode == 0 or 'not signed at all' in signature.stdout, 'Unable to inspect binary signature'
          with zipfile.ZipFile(ipas[0]) as archive:
              names = archive.namelist()
              root = f'Payload/{app.name}/'
              assert all(name.startswith('Payload/') and '..' not in pathlib.PurePosixPath(name).parts for name in names), 'Unexpected IPA layout'
              assert all(root + 'assets/ui/' + path in names for path in required), 'Missing IPA application resources'
              assert not any(pathlib.PurePosixPath(name).suffix.lower() in private_suffixes for name in names), 'Private signing material in IPA'
              assert archive.read(root + info['CFBundleExecutable']) == executable.read_bytes(), 'IPA does not match verified device binary'
          output = pathlib.Path('.build/artifacts/Rail-Map-Toolkit-ios-unsigned.ipa')
          shutil.copy2(ipas[0], output)
          print('Verified arm64 iPhone IPA, bundled applications, unsigned identity and path privacy.')
          PY
          cd .build/artifacts
          shasum -a 256 Rail-Map-Toolkit-ios-unsigned.ipa ui-sources.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Rail-Map-Toolkit-ios-unsigned
          path: |
            tauri/.build/artifacts/*.ipa
            tauri/.build/artifacts/ui-sources.json
            tauri/.build/artifacts/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Prepare diagnostic logs
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          root = pathlib.Path('.build/logs')
          output = root / 'public'
          output.mkdir(parents=True, exist_ok=True)
          for log in root.glob('*.log'):
              text = log.read_text(errors='replace')
              for key, replacement in [('GITHUB_WORKSPACE', '/src'), ('HOME', '/toolchain')]:
                  text = text.replace(os.environ[key], replacement)
              text = re.sub(r'[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}', '[redacted-email]', text)
              (output / log.name).write_text(text)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-logs
          path: tauri/.build/logs/public/*.log
          if-no-files-found: ignore
          retention-days: 7
